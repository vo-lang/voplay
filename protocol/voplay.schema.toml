schema = "voplay.engine"
schema_format = 1
payload_major = 1
payload_minor = 1

[packet]
endianness = "little"
header_bytes = 80

[[packet.field]]
name = "kind"
type = "message_kind"
offset = 0

[[packet.field]]
name = "engine"
type = "handle"
offset = 4

[[packet.field]]
name = "channel_epoch"
type = "u64"
offset = 12

[[packet.field]]
name = "commit_id"
type = "u64"
offset = 20

[[packet.field]]
name = "base_revision"
type = "u64"
offset = 28

[[packet.field]]
name = "new_revision"
type = "u64"
offset = 36

[[packet.field]]
name = "required_control_revision"
type = "u64"
offset = 44

[[packet.field]]
name = "source_simulation_revision"
type = "u64"
offset = 52

[[packet.field]]
name = "sequence"
type = "u64"
offset = 60

[[packet.field]]
name = "payload_len"
type = "payload_length_u32"
offset = 76

[limits]
max_packet_bytes = 67108864
max_transaction_ops = 131072
max_snapshot_objects = 1000000
max_event_payload_bytes = 262144
max_staged_events = 4096
max_staged_event_bytes = 4194304

[tick_output]
magic = "voplay-tick-output-v1\\0"
endianness = "little"
count_type = "u32"
role_type = "u8"
packet_length_type = "u32"
max_packets = 4096
max_packet_bytes = 1048576
max_bytes = 16777216
canonical_role_order = ["render", "asset", "audio", "logic"]

[tick_input]
version = 6
endianness = "little"
fixed_header_bytes = 36
return_count_type = "u32"
return_packet_length_type = "u32"
max_return_packets = 4096
max_return_packet_bytes = 1048576
max_bytes = 16777216
canonical_return_role_order = ["render", "asset", "audio", "logic"]
bootstrap_count_type = "u32"
bootstrap_handle_type = "u64"
bootstrap_descriptor_length_type = "u32"
max_bootstrap_records = 65536
max_bootstrap_descriptor_bytes = 1048576
canonical_bootstrap_order = ["initial-entity", "requested-asset", "render-view"]

[[tick_output.role]]
name = "render"
tag = 1

[[tick_output.role]]
name = "asset"
tag = 2

[[tick_output.role]]
name = "audio"
tag = 3

[[tick_output.role]]
name = "logic"
tag = 4

